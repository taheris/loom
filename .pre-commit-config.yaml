fail_fast: true
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: '^.beads/config.yaml$'
      - id: check-merge-conflict
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: native-cargo-capabilities
        name: Initialize native Cargo capabilities
        entry: bash scripts/configure-cargo-patches.sh
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false

      - id: treefmt
        name: treefmt --fail-on-change
        entry: treefmt --fail-on-change
        language: system
        stages: [pre-commit]
        pass_filenames: false

      - id: shell-reexec-explicit-interpreter
        name: shell-reexec-explicit-interpreter
        entry: scripts/check-shell-reexec
        language: system
        stages: [pre-commit]
        types: [shell]

      - id: loom-gate-verify-files
        name: loom gate verify --files
        entry: loom gate verify --files
        language: system
        stages: [pre-commit]
        pass_filenames: true
        require_serial: true

      # The marker is consumed by the `pre-push-checks` wrapper per-hook; a
      # standalone gating hook blocks operator-manual pushes that have no
      # marker. The wrapper still validates the marker on every slow-tier
      # hook and short-circuits on driver-loop integration pushes.

      - id: nix-flake-check
        name: nix flake check
        entry: bin/pre-push-checks --hook-id nix-flake-check --hook-entry 'nix flake check' -- nix flake check
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: cargo-clippy-production
        name: cargo clippy --workspace -- -D warnings
        entry: bin/pre-push-checks --hook-id cargo-clippy-production --hook-entry 'cargo clippy --workspace -- -D warnings' -- cargo clippy --workspace -- -D warnings
        language: system
        stages: [pre-push]
        files: '(\.rs$|(^|/)Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^clippy\.toml$)'
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy --workspace --all-targets -- -D warnings
        entry: bin/pre-push-checks --hook-id cargo-clippy --hook-entry 'cargo clippy --workspace --all-targets -- -D warnings' -- cargo clippy --workspace --all-targets -- -D warnings
        language: system
        stages: [pre-push]
        files: '(\.rs$|(^|/)Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^clippy\.toml$)'
        pass_filenames: false

      - id: native-suite-inputs
        name: Audit and prepare native suite inputs
        entry: bin/pre-push-checks --hook-id native-suite-inputs --hook-entry 'nix run .#test-required -- --prepare-only' -- nix run .#test-required -- --prepare-only
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: loom-gate-verify-diff
        name: loom gate verify --diff (includes the required native suite)
        entry: bin/pre-push-checks --hook-id loom-gate-verify-diff --hook-entry 'loom gate verify --diff' --append-push-range -- loom gate verify --diff
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: native-tcp-readiness
        name: Require real native TCP SQL readiness control
        entry: bin/pre-push-checks --hook-id native-tcp-readiness --hook-entry "cargo nextest run --package loom-workflow --features native-tcp-tests --lib -E test(native_tracker_readiness_requires_the_beads_socket_even_with_healthy_tcp_sql)" -- cargo nextest run --package loom-workflow --features native-tcp-tests --lib -E 'test(native_tracker_readiness_requires_the_beads_socket_even_with_healthy_tcp_sql)'
        language: system
        stages: [pre-push]
        files: '(^crates/|^nix/|^scripts/|^tests/|^\.cargo/|^\.pre-commit-config\.yaml$|^flake\.(nix|lock)$|^rust-toolchain\.toml$|(^|/)Cargo\.(toml|lock)$)'
        pass_filenames: false
        require_serial: true
