[package]
name = "loom"
# Share integration-test linkage; Nextest still gives every case a fresh process.
autotests = false
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "loom"
path = "src/main.rs"

[[bin]]
name = "bd-shim"
path = "src/bin/bd-shim.rs"

[[bin]]
name = "mock-loom-agent"
path = "src/bin/mock-loom-agent.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

# Preserve snapshot names and exact child-process entry points.
[[test]]
name = "cli_help"
path = "tests/cli_help.rs"

[[test]]
name = "gate_cli_scope"
path = "tests/gate_cli_scope.rs"

[[test]]
name = "private_cargo_gate"
path = "tests/private_cargo_gate.rs"

[[test]]
name = "spawn_dispatch"
path = "tests/spawn_dispatch.rs"

[[test]]
name = "tune_cli"
path = "tests/tune_cli.rs"

[dependencies]
anyhow = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
loom-agent = { workspace = true }
loom-driver = { workspace = true }
loom-events = { workspace = true }
loom-gate = { workspace = true }
loom-protocol = { workspace = true }
loom-render = { workspace = true }
loom-tune = { workspace = true }
loom-walk = { workspace = true }
loom-workflow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
loom-driver = { workspace = true, features = ["test-support"] }
loom-templates = { workspace = true }
loom-test-support = { workspace = true, features = ["acceptance"] }
nix = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
walkdir = { workspace = true }

[lints]
workspace = true
