[package]
name = "loom-workflow"
autotests = false
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

# Git-policy fixtures reexecute exact libtest entry points in this target.
[[test]]
name = "parallel"
path = "tests/parallel.rs"

# Quint's production bridge compiles and invokes this narrow target directly.
[[test]]
name = "todo_production"
path = "tests/todo_production.rs"

[dependencies]
askama = { workspace = true }
blake3 = { workspace = true }
loom-agent = { workspace = true }
loom-driver = { workspace = true }
loom-events = { workspace = true }
loom-gate = { workspace = true }
loom-issues = { workspace = true }
loom-llm = { workspace = true }
loom-protocol = { workspace = true }
loom-render = { workspace = true }
loom-skill = { workspace = true }
loom-shared = { workspace = true }
loom-templates = { workspace = true }
loom-tune = { workspace = true }
loom-walk = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
displaydoc = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
loom-driver = { workspace = true, features = ["test-support"] }
loom-test-support = { workspace = true, features = ["acceptance"] }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

[[example]]
name = "native-worker-preflight"
test = true

[lints]
workspace = true
