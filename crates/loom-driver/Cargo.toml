[package]
name = "loom-driver"
autotests = false
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

# Keep exact subprocess entry points and logging capture targets unchanged.
[[test]]
name = "git_client"
path = "tests/git_client.rs"

[[test]]
name = "lock_manager"
path = "tests/lock_manager.rs"

[[test]]
name = "logging"
path = "tests/logging.rs"

[dependencies]
loom-shared = { workspace = true }
url = { workspace = true }
displaydoc = { workspace = true }
gix = { workspace = true }
loom-events = { workspace = true }
loom-issues = { workspace = true }
loom-protocol = { workspace = true }
loom-skill = { workspace = true }
loom-render = { workspace = true }
pulldown-cmark = { workspace = true }
rusqlite = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[features]
# Exposes fixture constructors and hook-path inputs, not alternate Git behavior.
# Off in production builds; the self dev-dependency below turns it on for tests.
test-support = []

[dev-dependencies]
anyhow = { workspace = true }
loom-driver = { path = ".", features = ["test-support"] }
loom-test-support = { workspace = true }
loom-llm = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
