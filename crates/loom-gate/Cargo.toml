[package]
name = "loom-gate"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# Owns annotation dispatch, the status cache, the integrity gate, and
# runner-discovery logic for `loom gate <subcommand>`. `loom-workflow`
# depends on this crate; further consumers should not be added without
# a spec change.
[dependencies]
base64 = { workspace = true }
blake3 = { workspace = true }
displaydoc = { workspace = true }
glob = { workspace = true }
loom-driver = { workspace = true }
loom-events = { workspace = true }
loom-protocol = { workspace = true }
nextest-filtering = { workspace = true }
pulldown-cmark = { workspace = true }
regex = { workspace = true }
roxmltree = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shlex = { workspace = true }
syn = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
walkdir = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
itf = { workspace = true }
quint-connect = { workspace = true }
loom-driver = { workspace = true, features = ["test-support"] }
loom-test-support = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
