[workspace]
resolver = "3"
members = [
    "crates/loom",
    "crates/loom-driver",
    "crates/loom-events",
    "crates/loom-llm",
    "crates/loom-skills",
    "crates/loom-tune",
    "crates/loom-render",
    "crates/loom-agent",
    "crates/loom-direct-runner",
    "crates/loom-gate",
    "crates/loom-protocol",
    "crates/loom-workflow",
    "crates/loom-templates",
    "crates/loom-test-support",
    "crates/loom-walk",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.metadata.crane]
name = "loom"

[workspace.dependencies]
anyhow = "1"
askama = "0.16"
base64 = "0.22"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
colored_json = "5"
crossterm = "0.29"
displaydoc = "0.2"
fd-lock = "4"
futures-core = "0.3"
genai = "0.6.5"
glob = "0.3"
imara-diff = "0.2"
gix = { version = "0.84", default-features = false, features = [
    "status",
    "blob-diff",
    "revision",
    "parallel",
    "sha1",
] }
insta = "1"
nix = { version = "0.31", default-features = false, features = ["signal", "term"] }
owo-colors = { version = "4", features = ["supports-colors"] }
proptest = "1"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "1", features = ["fs"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2"
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
sha2 = "0.10"
shlex = "2"
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-test = "0.4"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trybuild = "1"
url = "2"
walkdir = "2"
wiremock = "0.6"

# Internal crates
loom-driver = { path = "crates/loom-driver" }
loom-events = { path = "crates/loom-events" }
loom-llm = { path = "crates/loom-llm" }
loom-skills = { path = "crates/loom-skills" }
loom-tune = { path = "crates/loom-tune" }
loom-render = { path = "crates/loom-render" }
loom-agent = { path = "crates/loom-agent" }
loom-direct-runner = { path = "crates/loom-direct-runner" }
loom-gate = { path = "crates/loom-gate" }
loom-protocol = { path = "crates/loom-protocol" }
loom-workflow = { path = "crates/loom-workflow" }
loom-templates = { path = "crates/loom-templates" }
loom-test-support = { path = "crates/loom-test-support" }
loom-walk = { path = "crates/loom-walk" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
panic = "deny"
expect_used = "deny"
allow_attributes = "warn"
assigning_clones = "allow"
bool_to_int_with_if = "allow"
branches_sharing_code = "allow"
case_sensitive_file_extension_comparisons = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
derive_partial_eq_without_eq = "allow"
doc_markdown = "allow"
duration_suboptimal_units = "allow"
elidable_lifetime_names = "allow"
float_cmp = "allow"
fn_params_excessive_bools = "allow"
format_push_string = "allow"
items_after_statements = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
needless_collect = "allow"
needless_continue = "allow"
needless_pass_by_value = "allow"
needless_raw_string_hashes = "allow"
option_if_let_else = "allow"
option_option = "allow"
or_fun_call = "allow"
redundant_clone = "allow"
redundant_closure_for_method_calls = "allow"
redundant_pub_crate = "allow"
ref_option = "allow"
return_self_not_must_use = "allow"
semicolon_if_nothing_returned = "allow"
significant_drop_tightening = "allow"
single_char_pattern = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
too_long_first_doc_paragraph = "allow"
too_many_lines = "allow"
trivially_copy_pass_by_ref = "allow"
uninlined_format_args = "allow"
unnecessary_literal_bound = "allow"
unnecessary_trailing_comma = "allow"
unnested_or_patterns = "allow"
unreadable_literal = "allow"
unused_self = "allow"
use_self = "allow"
default_trait_access = "allow"
format_collect = "allow"
future_not_send = "allow"
ignore_without_reason = "allow"
literal_string_with_formatting_args = "allow"
needless_pass_by_ref_mut = "allow"
ref_as_ptr = "allow"
similar_names = "allow"
unnecessary_wraps = "allow"
unused_async = "allow"
used_underscore_binding = "allow"
zero_sized_map_values = "allow"
no_effect_underscore_binding = "allow"
struct_field_names = "allow"
ignored_unit_patterns = "allow"
unnecessary_debug_formatting = "allow"
